name: Workforce release checks

on:
  push:
    branches: [main, codex/kalshi-demo-v4-20260916]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt pytest==9.2.0 httpx==0.28.1
      - run: python -m pytest tests -q
