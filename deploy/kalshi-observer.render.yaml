# Separate account observer only. Does not deploy trading or strategy execution.
services:
  - type: worker
    name: kalshi-account-observer
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m opportunity_lab.kalshi_account_monitor --watch --output /var/data/kalshi
    numInstances: 1
    disk:
      name: kalshi-account-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: KALSHI_API_KEY_ID
        sync: false
      - key: KALSHI_PRIVATE_KEY_PATH
        value: /etc/secrets/kalshi-private.pem
