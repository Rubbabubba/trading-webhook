# Demo-only maker experiment. Credentials stay in the existing Render service.
services:
  - type: worker
    name: kalshi-demo-v5-maker
    runtime: python
    plan: starter
    autoDeploy: false
    buildCommand: pip install -r deploy/kalshi-demo-v4.requirements.txt
    startCommand: python -m opportunity_lab.kalshi_demo_v5_maker_worker --data-root /var/data/kalshi-demo-v5
    numInstances: 1
    disk:
      name: kalshi-demo-v4-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: KALSHI_DEMO_API_KEY_ID
        sync: false
      - key: KALSHI_DEMO_PRIVATE_KEY_PATH
        value: /etc/secrets/kalshi-demo-private.pem
